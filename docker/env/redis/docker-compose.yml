version: '3.8'
services:
  cache:
    image: redis:6.2-alpine
    restart: always
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning --requirepass eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81
    volumes:
      - ./data:/data
      - ./conf:/usr/local/etc/redis
      - ./log:/var/log/redis
volumes:
  cache:
    driver: local
