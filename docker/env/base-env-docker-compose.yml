version: '3'

services:
  influxdb:
    image: influxdb:2.6-alpine
    env_file:
      - ./influx/influxv2.env
    volumes:
      # Mount for influxdb data directory and configuration
      - influxdbv2:/var/lib/influxdb2:rw
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "8086:8086"
    networks:
      - iot-net
  telegraf:
    image: telegraf:1.25
    depends_on:
      - influxdb
    volumes:
      # Mount for telegraf config
      - ./influx/telegraf/mytelegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      - TZ=Asia/Shanghai
    env_file:
      - ./influx/influxv2.env
    networks:
      - iot-net
  mongodb:
    image: mongo
    container_name: mongodb
    ports:
      - 27017:27017
    volumes:
      - ./mongo/database:/data/db
      - ./mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
      - TZ=Asia/Shanghai
    networks:
      - iot-net
  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: always
    ports:
      - 8181:8081
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=admin
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - TZ=Asia/Shanghai
    networks:
      - iot-net
  emqx1:
    image: emqx:5.4.1
    container_name: emqx1
    environment:
      - "EMQX_NODE_NAME=emqx@node1.emqx.io"
      - "EMQX_CLUSTER__DISCOVERY_STRATEGY=static"
      - "EMQX_CLUSTER__STATIC__SEEDS=[emqx@node1.emqx.io]"
      - TZ=Asia/Shanghai
    healthcheck:
      test: [ "CMD", "/opt/emqx/bin/emqx ctl", "status" ]
      interval: 5s
      timeout: 25s
      retries: 5
    networks:
      iot-net:
        aliases:
          - node1.emqx.io
    ports:
      - 1883:1883
      - 8083:8083
      - 8084:8084
      - 8883:8883
      - 18083:18083
  mysql:
    image: mysql:8.0
    container_name: mysql8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: iot
      MYSQL_USER: app
      MYSQL_PASSWORD: iot123456
      TZ: "Asia/Shanghai"
    volumes:
      - ./mysql/data:/var/lib/mysql
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --binlog-format=ROW
    networks:
      - iot-net
  rabbitmq:
    image: rabbitmq:3.13.3-management
    container_name: 'rabbitmq'
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - ./rabbitmq/data/:/var/lib/rabbitmq/
      - ./rabbitmq/log/:/var/log/rabbitmq
      - ./rabbitmq/plugins:/usr/lib/rabbitmq/plugins
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:rw
    environment:
      - RABBITMQ_PLUGINS_DIR=/opt/rabbitmq/plugins:/usr/lib/rabbitmq/plugins
      - TZ=Asia/Shanghai
    networks:
      - iot-net

  redis:
    image: redis:6.2-alpine
    restart: always
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning --requirepass eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./redis/data:/data
      - ./redis/conf:/usr/local/etc/redis
      - ./redis/log:/var/log/redis
    networks:
      - iot-net
  prometheus:
    image: bitnami/prometheus:latest
    environment:
      - TZ=Asia/Shanghai
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/opt/bitnami/prometheus/conf/prometheus.yml
    networks:
      - iot-net
  grafana:
    image: grafana/grafana
    environment:
      - TZ=Asia/Shanghai
    ports:
      - '9091:3000'
    networks:
      - iot-net
volumes:
    influxdbv2:

networks:
  iot-net:
    driver: bridge

