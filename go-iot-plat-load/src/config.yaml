site:
  name: 'Go IoT 开发平台'
  site: 'https://iot-dev-egi.pages.dev'
  base: '/'
  trailingSlash: false
  googleSiteVerificationId: ""

# Default SEO metadata
metadata:
  title:
    default: 'Go IoT 开发平台'
    template: '%s — Go IoT 开发平台'
  description: "Go-IoT平台，一种使用Go语言开发的高效、可扩展的物联网解决方案。该平台侧重于提供稳定可靠的MQTT客户端管理，以及对MQTT报告数据的全面处理和分析。"
  
  robots:
    index: true
    follow: true
  openGraph:
    site_name: GoIoPlatform
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@fer_hui14457'
    site: '@fer_hui14457'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'light' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
